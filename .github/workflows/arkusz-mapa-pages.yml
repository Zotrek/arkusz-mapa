# Uruchomienia:
#   • Ręcznie: Actions → „arkusz-mapa — Pages” → Run workflow.
#   • Harmonogram: zewnętrzny cron → API workflow_dispatch (docs/harmonogram-github-actions.md).
#     GitHub on.schedule w tym repo nie działa (0 runów schedule w historii).
# Katalog główny repozytorium = ten pakiet (arkusz-mapa).
#
# Wymagane sekrety:
#   GOOGLE_SHEETS_ID              — ID arkusza z URL Google Sheets
#   GOOGLE_SERVICE_ACCOUNT_JSON   — cały plik JSON klucza Service Account
#   CLOUDFLARE_API_TOKEN          — Pages Edit
#   CLOUDFLARE_ACCOUNT_ID         — Account ID z dash CF
#   CLOUDFLARE_PAGES_PROJECT      — nazwa projektu Pages (np. arkusz-mapa-xxxx)
#   NOMINATIM_CONTACT_EMAIL       — e-mail kontaktowy w User-Agent Nominatim (polityka OSM); bez niego tylko ostrzeżenie
#
# Build wpisuje TRANSPORT_WEBAPP_URL=/api/transport (same-origin Pages) — bez sekretu.
# Testy + tsc przed generate: czerwone = nic nie trafia do arkuszy ani na Pages.
# Generate w GH Actions → wrangler pages deploy → *.pages.dev
# Na CF Pages env: CFP_PASSWORD + GAS_PROXY_BASE=https://….workers.dev
# W CF: wyłącz auto-build z Gita, żeby nie dublować.
#
# GitHub Pages (github.io / gałąź gh-pages): NIE publikujemy — nie pushujemy do gh-pages.
#
# W repo muszą być (domyślnie):
#   docs/pusty.docx
#   docs/podwyko lista.xlsx
#
# Cache geokodowania: commituj data/phase5-cache.json po lokalnym `npm run generate`.
# Na CI: merge data/ (priorytet) + Actions cache — patrz scripts/merge-phase5-cache.mjs
#
# Każde uruchomienie zastępuje całą witrynę na Cloudflare (tylko mapy z tego biegu).
name: arkusz-mapa — Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cały katalog .cache/ — pojedynczy plik w path bywał niestabilny przy save/restore.
      # restore + osobny save z always(): nowe geokody zostają także przy błędzie po generate.
      - name: Przywróć cache adresów (faza 5)
        id: cache-phase5
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: phase5-geocode-v2-${{ github.run_id }}
          restore-keys: |
            phase5-geocode-v2-

      # Repo data/ nadpisuje ten sam klucz adresu co Actions; wpisy tylko z Actions zostają.
      - name: Scal cache (data/ + Actions)
        run: node scripts/merge-phase5-cache.mjs

      - name: Raport cache (diagnostyka)
        run: |
          echo "actions/cache cache-hit=${{ steps.cache-phase5.outputs.cache-hit }}"
          if [ -f .cache/phase5-cache.json ]; then
            echo "phase5-cache.json: bytes=$(wc -c < .cache/phase5-cache.json)"
            node -e "
              const fs = require('fs');
              const p = '.cache/phase5-cache.json';
              const j = JSON.parse(fs.readFileSync(p,'utf8'));
              const n = j.entries && typeof j.entries === 'object' ? Object.keys(j.entries).length : 0;
              console.log('JSON version=', j.version, 'entries=', n);
            " || echo "(niepoprawny JSON — faza 5 wczyta 0 wpisów)"
          else
            echo "Brak pliku .cache/phase5-cache.json przed generate."
          fi

      # cache: npm — patrz komentarz w arkusz-mapa-ci.yml
      - uses: actions/setup-node@v4
        with:
          # 24.17.x: regresja keep-alive → OAuth „Premature close” (google-auth-library v9).
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Testy i typy
        run: |
          npm test
          npx tsc --noEmit

      - name: Zapis klucza Service Account
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::Brak sekretu GOOGLE_SERVICE_ACCOUNT_JSON"
            exit 1
          fi
          umask 077
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > .ci-credentials.json

      - name: Generuj mapę (Google Sheets → HTML)
        id: generate
        env:
          GOOGLE_SHEETS_ID: ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/.ci-credentials.json
          OUTPUT_DIR: ${{ github.workspace }}/site/maps
          PHASE5_CACHE_PATH: ${{ github.workspace }}/.cache/phase5-cache.json
          NOMINATIM_CONTACT_EMAIL: ${{ secrets.NOMINATIM_CONTACT_EMAIL }}
        run: |
          if [ -z "$GOOGLE_SHEETS_ID" ]; then
            echo "::error::Brak sekretu GOOGLE_SHEETS_ID"
            exit 1
          fi
          export TRANSPORT_WEBAPP_URL="/api/transport"
          echo "TRANSPORT_WEBAPP_URL=$TRANSPORT_WEBAPP_URL"
          mkdir -p "$OUTPUT_DIR"
          # Kod 2 = mapa gotowa, ale zapis do arkusza nie wszedł → publikujemy, job czerwony na końcu.
          status=0
          npm run generate || status=$?
          if [ "$status" -eq 2 ]; then
            echo "write_failed=1" >> "$GITHUB_OUTPUT"
          elif [ "$status" -ne 0 ]; then
            exit "$status"
          fi

      - name: Usuń klucz Service Account
        if: always()
        run: rm -f .ci-credentials.json

      - name: Zapisz cache adresów (faza 5)
        if: always() && steps.generate.outcome != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: phase5-geocode-v2-${{ github.run_id }}

      - name: Strona indeksu i stały adres /map
        run: node scripts/build-pages-index.mjs

      - name: Publikacja na Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Brak CLOUDFLARE_API_TOKEN lub CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [ -z "$PROJECT" ]; then
            echo "::error::Brak CLOUDFLARE_PAGES_PROJECT"
            exit 1
          fi
          npx --yes wrangler@4 pages deploy ./site --project-name="$PROJECT" --commit-dirty=true

      - name: Zgłoś nieudane zapisy do arkuszy
        if: steps.generate.outputs.write_failed == '1'
        run: |
          echo "::error::Mapa opublikowana, ale część zapisów do arkuszy się nie udała — szukaj MAP-E-SHEETS-WRITE w logu kroku generowania."
          exit 1
